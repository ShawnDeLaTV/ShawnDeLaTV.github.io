<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matthieu Sonzogni - CheatSheets</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  
  <style>
    /* --- SYSTEME DE DESIGN --- */
    :root {
      --max: 1000px; 
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --bg: #0d0e12; 
      --surface: rgba(19, 21, 27, 0.45);
      --border: rgba(255, 255, 255, 0.06);
      --border2: rgba(255, 255, 255, 0.12);
      --fg: #e2e8f0; 
      --muted: #94a3b8;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.3);
      --accent-bg: rgba(168, 85, 247, 0.06);
      --grad: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      --code-bg: #050508;
    }

    html.light, body.light {
      --bg: #f7f5f0; 
      --surface: rgba(255, 255, 255, 0.55);
      --border: rgba(0, 0, 0, 0.05);
      --border2: rgba(0, 0, 0, 0.08);
      --fg: #2c3539; 
      --muted: #576066;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.15);
      --accent-bg: rgba(124, 58, 237, 0.04);
      --code-bg: #eae6db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }
    .container { max-width: var(--max); margin: 0 auto; padding: 120px 24px 60px; }

    /* --- CONTROLES PORTFOLIO --- */
    .nav-controls-fixed { position: fixed; top: 25px; right: 25px; z-index: 1100; display: flex; align-items: center; gap: 15px; }
    .lang-selector { display: flex; background: var(--border); border-radius: 99px; padding: 2px; position: relative; cursor: pointer; }
    .lang-option { padding: 4px 10px; font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--muted); position: relative; z-index: 2; transition: 0.3s; }
    .lang-option.active { color: var(--bg); }
    .lang-pill { position: absolute; top: 2px; left: 2px; width: calc(50% - 2px); height: calc(100% - 4px); background: var(--fg); border-radius: 99px; z-index: 1; transition: 0.3s; }
    body.lang-en .lang-pill { transform: translateX(100%); }
    .theme-switch { position: relative; width: 44px; height: 24px; background: var(--border); border-radius: 99px; cursor: pointer; display: flex; align-items: center; padding: 0 3px; }
    .switch-handle { width: 18px; height: 18px; background: var(--fg); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.4s; }
    body.light .theme-switch .switch-handle { transform: translateX(20px); }
    .switch-handle svg { width: 11px; height: 11px; color: var(--bg); }

    /* --- EN-TÊTE --- */
    header { margin-bottom: 40px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 11px; font-family: var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
    h1 { font-size: 42px; font-weight: 900; letter-spacing: -1.5px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
    .desc { color: var(--muted); font-size: 14px; margin-top: 5px; }

    /* --- FILTRE DE RECHERCHE --- */
    .controls { margin-bottom: 35px; }
    .search-wrapper { position: relative; max-width: 400px; width: 100%; }
    .search-input { width: 100%; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--fg); font-size: 13px; font-family: var(--font); outline: none; transition: 0.2s; backdrop-filter: blur(14px); }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

    /* --- ACCORDÉONS (COLLAPSE) --- */
    .collapse-group { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; margin-bottom: 16px; overflow: hidden; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .collapse-header { padding: 18px 24px; font-size: 14px; font-weight: 800; font-family: var(--font); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; background: rgba(255,255,255,0.01); transition: background 0.2s; }
    .collapse-header:hover { background: var(--accent-bg); }
    .collapse-arrow { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform 0.2s; margin-right: 4px; }
    .collapse-group.open .collapse-arrow { transform: rotate(45deg); }
    .collapse-content { display: none; padding: 24px; border-top: 1px solid var(--border); background: rgba(0, 0, 0, 0.08); }
    .collapse-group.open .collapse-content { display: block; }

    /* --- BLOCS INTERNES --- */
    .problem-block { margin-bottom: 35px; }
    .problem-block:last-child { margin-bottom: 0; }
    .memo-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .memo-title { font-size: 18px; font-weight: 800; color: var(--fg); }
    
    .tags-container { display: flex; gap: 6px; }
    .tag-pill { color: var(--accent); font-family: var(--mono); font-size: 9px; font-weight: 700; background: rgba(168, 85, 247, 0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.15); }

    /* Rendu Markdown simple */
    .explanation-markdown { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .explanation-markdown p { margin-bottom: 12px; }
    .explanation-markdown ul, .explanation-markdown ol { padding-left: 20px; margin-bottom: 14px; }
    .explanation-markdown li { margin-bottom: 6px; }
    .explanation-markdown code { font-family: var(--mono); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; color: var(--fg); font-size: 12px; }
    html.light .explanation-markdown code { background: rgba(0,0,0,0.06); }
    .explanation-markdown strong { color: var(--fg); }
    .explanation-markdown img { max-width: 100%; height: auto; margin: 16px 0; border-radius: 8px; display: block; border: 1px solid var(--border); }

    /* --- CONTAINER DE CODE / APPARENCE TERMINAL --- */
    .editor-container { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; font-family: var(--mono); font-size: 12.5px; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
    .lang-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; font-family: var(--mono); }
    .copy-btn { background: transparent; border: none; color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .copy-btn:hover { color: var(--fg); }
    
    .code-content { padding: 14px 16px; overflow-x: auto; white-space: pre; color: #bdbdbd; line-height: 1.5; }
    .separator { border: none; height: 1px; background: var(--border); margin: 30px 0; }

    @media (max-width: 768px) {
      .nav-controls-fixed { top: 15px; right: 15px; transform: scale(0.9); }
      .container { padding-top: 80px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body class="lang-fr">

<canvas id="bg-canvas"></canvas>

<div class="nav-controls-fixed">
  <div class="lang-selector" id="lang-selector">
    <div class="lang-pill"></div>
    <div class="lang-option active" id="opt-fr">FR</div>
    <div class="lang-option" id="opt-en">EN</div>
  </div>
  <div class="theme-switch" id="theme-toggle">
    <div class="switch-handle">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path id="theme-path" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/>
      </svg>
    </div>
  </div>
</div>

<div class="container">
  <header>
    <a href="../index.html" class="back-link">← <span data-txt-fr="Retour au Portfolio" data-txt-en="Back to Portfolio">Retour au Portfolio</span></a><br>
    <h1>My Cheat Sheets</h1>
    <p class="desc" 
       data-txt-fr="Mes notes personnelles quand j'apprends quelque chose. Ce contenu est 100% gratuit et open-source." 
       data-txt-en="My personal notes when I learn something new. This content is 100% free and open-source.">
       Mes notes personnelles quand j'apprends quelque chose. Ce contenu est 100% gratuit et open-source.
    </p>
  </header>

  <section class="controls">
    <div class="search-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="Filtrer par mot-clé...">
    </div>
  </section>

  <main id="accordion-container"></main>
</div>

<script src="config.js"></script>
<script>
  function toggleCollapse(header) {
    header.parentElement.classList.toggle('open');
  }

  function copyCode(btn) {
    const code = btn.parentElement.nextElementSibling.innerText;
    navigator.clipboard.writeText(code).then(() => {
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy", 2000);
    });
  }

  // Parseur d'affichage robuste (Markdown vers HTML sécurisé)
  function parseMarkdown(text) {
    if (!text) return '';
    
    // Étape 1 : Protection contre les injections XSS
    let escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Étape 2 : Extraction et préservation des images Markdown ![alt](url)
    const images = [];
    escaped = escaped.replace(/!\[(.*?)\]\((.*?)\)/g, function(match, alt, src) {
      const placeholder = `___IMG_PLACEHOLDER_${images.length}___`;
      images.push(`<img src="${src}" alt="${alt}">`);
      return placeholder;
    });

    // Étape 3 : Rendu des structures sémantiques standards (Gras et Code Inline)
    escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/`(.*?)`/g, '<code>$1</code>');

    // Étape 4 : Traitement ligne par ligne pour isoler les listes et paragraphes
    const lines = escaped.split('\n');
    let output = '';
    let isList = false;

    lines.forEach(line => {
      let content = line.trim();
      if (!content) return;

      if (content.startsWith('* ') || content.startsWith('- ')) {
        if (!isList) { output += '<ul>'; isList = true; }
        output += `<li>${content.substring(2)}</li>`;
      } else {
        if (isList) { output += '</ul>'; isList = false; }
        output += `<p>${content}</p>`;
      }
    });
    if (isList) output += '</ul>';

    // Étape 5 : Ré-injection sécurisée des images hors des balises textuelles <p>
    images.forEach((imgTag, idx) => {
      output = output.replace(`<p>___IMG_PLACEHOLDER_${idx}___</p>`, imgTag);
      output = output.replace(`___IMG_PLACEHOLDER_${idx}___`, imgTag);
    });

    return output;
  }

  function renderCheatSheet(lang) {
    const container = document.getElementById('accordion-container');
    const data = CHEATSHEET_DATA[lang] || CHEATSHEET_DATA['fr'];
    container.innerHTML = '';

    data.forEach((cat, index) => {
      const isOpen = '';
      let categoryHtml = `
        <div class="collapse-group ${isOpen}">
          <div class="collapse-header" onclick="toggleCollapse(this)">
            <span class="collapse-arrow"></span>
            <span>${cat.category}</span>
          </div>
          <div class="collapse-content">
      `;

      cat.memos.forEach((memo, mIndex) => {
        categoryHtml += `
          <div class="problem-block" data-search="${memo.search.toLowerCase()}">
            <div class="memo-header">
              <div class="memo-title">${memo.title}</div>
              <div class="tags-container">
                ${memo.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
              </div>
            </div>
            <div class="explanation-markdown">${parseMarkdown(memo.markdown)}</div>
            <div class="editor-container">
              <div class="editor-header">
                <span class="lang-label">${memo.lang}</span>
                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
              </div>
              <div class="code-content">${memo.code}</div>
            </div>
          </div>
        `;
        if (mIndex < cat.memos.length - 1) {
          categoryHtml += '<hr class="separator">';
        }
      });

      categoryHtml += `</div></div>`;
      container.innerHTML += categoryHtml;
    });
  }

  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase().trim();
    document.querySelectorAll('.problem-block').forEach(block => {
      const searchTerms = block.getAttribute('data-search');
      const title = block.querySelector('.memo-title').innerText.toLowerCase();
      if (searchTerms.includes(query) || title.includes(query)) {
        block.style.display = 'block';
        block.closest('.collapse-group').classList.add('open');
      } else {
        block.style.display = 'none';
      }
    });
  });

  function applyLanguage(lang) {
    localStorage.setItem('pref-lang', lang);
    document.body.className = (lang === 'en') ? 'lang-en' : 'lang-fr';
    document.getElementById('opt-en').classList.toggle('active', lang === 'en');
    document.getElementById('opt-fr').classList.toggle('active', lang === 'fr');
    searchInput.placeholder = (lang === 'en') ? "Filter by keyword..." : "Filtrer par mot-clé...";

    document.querySelectorAll('[data-txt-fr]').forEach(el => {
      el.innerHTML = (lang === 'en') ? el.getAttribute('data-txt-en') : el.getAttribute('data-txt-fr');
    });
    renderCheatSheet(lang);
  }

  document.getElementById('lang-selector').addEventListener('click', () => {
    applyLanguage(document.body.classList.contains('lang-en') ? 'fr' : 'en');
  });

  function applyTheme(theme) {
    const isLight = (theme === 'light');
    if (isLight) {
      document.documentElement.classList.add('light');
      document.body.classList.add('light');
    } else {
      document.documentElement.classList.remove('light');
      document.body.classList.remove('light');
    }
    localStorage.setItem('pref-theme', theme);
    const themePath = document.getElementById('theme-path');
    if (themePath) {
      themePath.setAttribute('d', isLight 
        ? "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" 
        : "M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"
      );
    }
    initCanvas();
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    applyTheme(document.documentElement.classList.contains('light') ? 'dark' : 'light');
  });

  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let pArr = [];

  window.initCanvas = function() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    pArr = [];
    const isLight = document.documentElement.classList.contains('light');
    const color = isLight ? '124, 58, 237' : '168, 85, 247';
    const count = window.innerWidth < 768 ? 50 : 120;
    
    for (let i = 0; i < count; i++) {
      pArr.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.2 + 0.8,
        speedX: (Math.random() - 0.5) * 0.35,
        speedY: (Math.random() - 0.5) * 0.35,
        color: `rgba(${color}, ${isLight ? '0.22' : '0.35'})`
      });
    }
  };

  function animate() {
    if(canvas && ctx) {
      const isLight = document.documentElement.classList.contains('light');
      const lineColor = isLight ? '124, 58, 237' : '168, 85, 247';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      pArr.forEach(p => {
        p.x += p.speedX; p.y += p.speedY;
        if(p.x > canvas.width) p.x = 0; if(p.x < 0) p.x = canvas.width;
        if(p.y > canvas.height) p.y = 0; if(p.y < 0) p.y = canvas.height;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      
      const maxDistance = 125;
      for (let i = 0; i < pArr.length; i++) {
        for (let j = i + 1; j < pArr.length; j++) {
          const dx = pArr[i].x - pArr[j].x;
          const dy = pArr[i].y - pArr[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDistance) {
            const alpha = ((1 - (dist / maxDistance)) * (isLight ? 0.07 : 0.14)).toFixed(3);
            ctx.strokeStyle = `rgba(${lineColor}, ${alpha})`;
            ctx.lineWidth = 1.3; ctx.beginPath();
            ctx.moveTo(pArr[i].x, pArr[i].y); ctx.lineTo(pArr[j].x, pArr[j].y); ctx.stroke();
          }
        }
      }
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', initCanvas);
  applyTheme(localStorage.getItem('pref-theme') || 'dark');
  applyLanguage(localStorage.getItem('pref-lang') || 'fr');
  animate();
</script>
</body>
</html>
